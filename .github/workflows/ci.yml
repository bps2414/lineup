name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['landing/**', '.github/workflows/pages.yml']
  pull_request:
    paths-ignore: ['landing/**', '.github/workflows/pages.yml']

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git curl unzip zip xz-utils zstd binutils \
            python3-venv llvm-18 llvm-18-dev clang-18 lld-18 libssl-dev exfatprogs exfat-fuse
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ps5-react/.deps
          key: deps-${{ hashFiles('ps5-react/dependencies.lock.json') }}
      - name: Stamp the build
        # The app replaces a lineupd of another build; test builds share a version, so the commit tells them apart.
        run: |
          B="$(git rev-parse --short HEAD)"
          sed -i "s/^export const BUILD = 'local';/export const BUILD = '$B';/" app/api.js
          sed -i "s/^#define LINEUPD_BUILD \"local\"/#define LINEUPD_BUILD \"$B\"/" app/payloads/lineupd.c
          grep -q "BUILD = '$B'" app/api.js && grep -q "LINEUPD_BUILD \"$B\"" app/payloads/lineupd.c
      - run: scripts/test.sh
      - run: scripts/build.sh
      - name: Package
        run: |
          V="$(sed -n "s/^export const VERSION = '\(.*\)';/\1/p" app/api.js)"
          scripts/package.sh "${V}-ci.$(git rev-parse --short HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: lineup-dist
          path: dist/*
